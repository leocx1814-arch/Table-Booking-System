services:
  db:
    image: mysql:8.0
    container_name: booking_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_LOCAL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - booking_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: booking_phpmyadmin_container
    platform: linux/amd64
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - booking_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: booking_backend_container
    restart: always
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      PORT: ${PORT:-5001}
      NODE_ENV: ${NODE_ENV:-development}
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-booking_db}
      MYSQL_USER: ${MYSQL_USER:-booking_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-booking_pass}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_tablebook_2026_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - booking_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: booking_frontend_container
    restart: always
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - booking_network

volumes:
  db_data:

networks:
  booking_network:
    driver: bridge
